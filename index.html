<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Shop">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Deol Weekly Shop</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2a26; --muted:#6b736f; --line:#e6e0d3;
    --brand:#2f5d50; --brand-soft:#e3ece8; --accent:#d9822b; --accent-soft:#fbeedd;
    --ok:#2e7d4f; --err:#b3402a; --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  header{padding:8px 4px 4px}
  .eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:700}
  h1{font-size:28px;line-height:1.15;margin:4px 0 6px;font-weight:800;letter-spacing:-.01em}
  .meta{color:var(--muted);font-size:15px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
  .pill.draft{background:var(--accent-soft);color:#8a4b10}
  .pill.approved{background:#dff1e6;color:var(--ok)}
  .banner{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:#7a4510;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
  .card h2{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
  .stats{display:flex;gap:10px}
  .stat{flex:1;background:var(--brand-soft);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:13px;color:var(--muted)}
  label.name{display:block;font-weight:600;margin-bottom:6px}
  input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .namechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;color:var(--ink)}
  .choice{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .choice:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .q{font-weight:700;margin-bottom:10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{position:relative;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;
    font:inherit;color:var(--ink);min-height:96px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt .k{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.05em}
  .opt .l{display:block;font-weight:700;margin:2px 0}
  .opt .d{display:block;font-size:13px;color:var(--muted)}
  .opt .p{display:block;font-size:14px;margin-top:6px;font-weight:600}
  .offer{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#8a4b10;background:var(--accent-soft);padding:2px 8px;border-radius:999px}
  .opt[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
  .opt[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:800;color:var(--brand)}
  .extra{display:flex;gap:8px;margin-top:8px}
  .mini{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  .mini[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
  .tally{font-size:13px;color:var(--muted);margin-top:8px}
  .tally b{color:var(--ink)}
  details.cat{border-top:1px solid var(--line);padding:10px 0}
  details.cat:first-of-type{border-top:0}
  details.cat summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;list-style:none}
  details.cat summary::-webkit-details-marker{display:none}
  details.cat summary::after{content:"＋";color:var(--muted)}
  details.cat[open] summary::after{content:"－"}
  ul.items{list-style:none;padding:0;margin:8px 0 0}
  ul.items li{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px dashed var(--line)}
  ul.items li:last-child{border-bottom:0}
  ul.items .q2{color:var(--muted);margin-right:6px}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.accent{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 70%,rgba(246,243,236,0))}
  .sticky .btn{max-width:528px;margin:0 auto}
  .msg{font-size:14px;margin-top:10px;min-height:1em}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .feedback-list{margin:0;padding:0;list-style:none}
  .feedback-list li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .feedback-list li:last-child{border-bottom:0}
  .feedback-list b{display:block;font-size:13px;color:var(--muted)}
  .pam select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;margin:4px 0 10px}
  .pam .row{margin-bottom:6px}
  .loading{color:var(--muted);text-align:center;padding:40px 0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="loading">Loading this week's shop…</p></div>
<div class="sticky" id="stickyBar" hidden><button class="btn primary" id="sendBtn">Send my picks</button></div>

<script src="config.js"></script>
<script>
(() => {
  const API = (window.SHOP_API_URL || "").trim();
  const DEMO = !API;
  const $ = (s, el = document) => el.querySelector(s);
  const money = n => "£" + Number(n).toFixed(2);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let plan, state = { votes: [], approval: null }, picks = {};

  async function api(method, body, week) {
    if (DEMO) {
      const key = "demo:" + (week || body.week);
      const db = store.get(key, { votes: [], approval: null });
      if (method === "GET") return db;
      if (body.action === "vote") {
        db.votes = db.votes.filter(v => v.name.toLowerCase() !== body.name.toLowerCase());
        db.votes.push({ ts: new Date().toISOString(), name: body.name, picks: body.picks, comment: body.comment });
      } else if (body.action === "approve") {
        if (body.pin !== "1234") return { ok: false, error: "Wrong PIN (demo PIN is 1234)" };
        db.approval = { ts: new Date().toISOString(), decisions: body.decisions, note: body.note };
      }
      store.set(key, db);
      return { ok: true };
    }
    if (method === "GET") {
      const r = await fetch(API + "?week=" + encodeURIComponent(week), { cache: "no-store" });
      return r.json();
    }
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    return r.json();
  }

  function tallyFor(choiceId) {
    const t = { A: 0, B: 0, both: 0, none: 0 };
    for (const v of state.votes) { const p = v.picks && v.picks[choiceId]; if (p && t[p] != null) t[p]++; }
    return t;
  }
  function majority(choiceId) {
    const t = tallyFor(choiceId);
    const order = ["A", "B", "both", "none"];
    let best = "A", n = -1;
    for (const k of order) if (t[k] > n) { best = k; n = t[k]; }
    return n > 0 ? best : "A";
  }
  const pickLabel = (c, k) => k === "both" ? "Both" : k === "none" ? "Neither" : (c.options.find(o => o.key === k) || {}).label || k;

  function render() {
    const approved = !!state.approval || plan.status === "approved";
    const total = plan.basket.reduce((s, c) => s + c.items.reduce((a, i) => a + i[2], 0), 0);
    const myName = store.get("name", "");
    const mine = state.votes.find(v => myName && v.name.toLowerCase() === myName.toLowerCase());
    if (!Object.keys(picks).length && mine) picks = { ...mine.picks };
    const feedback = state.votes.filter(v => v.comment && v.comment.trim());

    $("#app").innerHTML = `
      <header>
        <div class="eyebrow">Deol weekly shop</div>
        <h1>${esc(plan.title)}</h1>
        <div class="meta">
          <span class="pill ${approved ? "approved" : "draft"}">${approved ? "Approved by Pam" : "Waiting for picks"}</span>
          &nbsp;Vote by ${esc(plan.voteBy)}
        </div>
      </header>
      ${DEMO ? `<div class="banner">Demo mode: picks are saved on this phone only until the shared sheet is connected.</div>` : ""}
      ${plan.note ? `<div class="banner">${esc(plan.note)}</div>` : ""}

      <section class="card">
        <div class="stats">
          <div class="stat"><b>${money(total)}</b><span>basket before choices</span></div>
          <div class="stat"><b>${money(plan.budget)}</b><span>weekly budget</span></div>
        </div>
        <p class="sub" style="margin:10px 0 0">${esc(plan.delivery)}</p>
      </section>

      ${approved ? approvedCard() : `
      <section class="card">
        <label class="name" for="who">Who's choosing?</label>
        <input type="text" id="who" placeholder="Your name" autocomplete="given-name" value="${esc(myName)}">
        <div class="namechips" id="chips"></div>
      </section>

      <section class="card">
        <h2>Pick one, or both</h2>
        <p class="sub">${plan.choices.length} quick choices this week. Tap A or B.</p>
        ${plan.choices.map(choiceBlock).join("")}
      </section>

      <section class="card">
        <h2>Anything else?</h2>
        <p class="sub">Requests, things we're out of, things you're bored of.</p>
        <textarea id="comment" placeholder="e.g. more crumpets please, no more peas!">${esc(mine ? mine.comment || "" : "")}</textarea>
        <div class="msg" id="sendMsg"></div>
      </section>`}

      ${feedback.length ? `<section class="card"><h2>What everyone said</h2><ul class="feedback-list">
        ${feedback.map(v => `<li><b>${esc(v.name)}</b>${esc(v.comment)}</li>`).join("")}</ul></section>` : ""}

      <section class="card">
        <h2>The basket</h2>
        <p class="sub">Your regulars, plus whatever wins above.</p>
        ${plan.basket.map(c => `
          <details class="cat">
            <summary><span>${esc(c.cat)}</span></summary>
            <ul class="items">${c.items.map(i => `<li><span><span class="q2">${i[1]}×</span>${esc(i[0])}</span><span>${money(i[2])}</span></li>`).join("")}</ul>
          </details>`).join("")}
      </section>

      ${approved ? "" : pamCard()}
    `;

    $("#stickyBar").hidden = approved;
    wire();
  }

  function choiceBlock(c) {
    const t = tallyFor(c.id);
    const voters = state.votes.length;
    return `<div class="choice" data-id="${esc(c.id)}">
      <div class="q">${esc(c.question)}</div>
      <div class="opts">${c.options.map(o => `
        <button class="opt" data-pick="${o.key}" aria-pressed="${picks[c.id] === o.key || picks[c.id] === "both"}">
          <span class="k">${o.key}</span>
          <span class="l">${esc(o.label)}</span>
          <span class="d">${esc(o.detail)}</span>
          <span class="p">${money(o.price)}</span>
          ${o.offer ? `<span class="offer">${esc(o.offer)}</span>` : ""}
        </button>`).join("")}
      </div>
      <div class="extra">
        <button class="mini" data-pick="both" aria-pressed="${picks[c.id] === "both"}">Both</button>
        <button class="mini" data-pick="none" aria-pressed="${picks[c.id] === "none"}">Neither</button>
      </div>
      ${voters ? `<div class="tally">So far: A <b>${t.A}</b> · B <b>${t.B}</b> · Both <b>${t.both}</b> · Neither <b>${t.none}</b></div>` : ""}
    </div>`;
  }

  function pamCard() {
    return `<section class="card pam">
      <h2>Pam's sign-off</h2>
      <p class="sub">Pam makes the final call. Choices start on the family favourite.</p>
      ${plan.choices.map(c => `
        <div class="row"><label for="dec-${esc(c.id)}"><b>${esc(c.question)}</b></label>
          <select id="dec-${esc(c.id)}">
            ${["A", "B", "both", "none"].map(k => `<option value="${k}" ${majority(c.id) === k ? "selected" : ""}>${esc(pickLabel(c, k))}</option>`).join("")}
          </select></div>`).join("")}
      <label for="pamNote"><b>Note for the order</b> <span class="sub">(optional)</span></label>
      <textarea id="pamNote" placeholder="e.g. skip the peas, add a cake for Saturday"></textarea>
      <label for="pin" style="display:block;margin-top:10px"><b>PIN</b></label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="Pam's PIN">
      <div style="height:12px"></div>
      <button class="btn accent" id="approveBtn">Approve this shop</button>
      <div class="msg" id="pamMsg"></div>
    </section>`;
  }

  function approvedCard() {
    const d = (state.approval && state.approval.decisions) || {};
    return `<section class="card">
      <h2>Pam approved the shop ✓</h2>
      <p class="sub">Claude will fill the Ocado trolley and book the slot.</p>
      <ul class="feedback-list">${plan.choices.map(c => `<li><b>${esc(c.question)}</b>${esc(pickLabel(c, d[c.id] || majority(c.id)))}</li>`).join("")}</ul>
      ${state.approval && state.approval.note ? `<p class="sub" style="margin-top:10px">Note: ${esc(state.approval.note)}</p>` : ""}
    </section>`;
  }

  function wire() {
    const who = $("#who");
    if (who) {
      const known = [...new Set(["Pam", "Jas", ...state.votes.map(v => v.name)])].slice(0, 8);
      $("#chips").innerHTML = known.map(n => `<button class="chip" type="button">${esc(n)}</button>`).join("");
      $("#chips").addEventListener("click", e => { if (e.target.matches(".chip")) { who.value = e.target.textContent; store.set("name", who.value); } });
      who.addEventListener("change", () => store.set("name", who.value.trim()));
    }
    document.querySelectorAll(".choice").forEach(el => {
      el.addEventListener("click", e => {
        const b = e.target.closest("[data-pick]"); if (!b) return;
        const id = el.dataset.id, k = b.dataset.pick;
        picks[id] = picks[id] === k ? undefined : k;
        if (picks[id] === undefined) delete picks[id];
        el.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(picks[id] === o.dataset.pick || picks[id] === "both")));
        el.querySelectorAll(".mini").forEach(o => o.setAttribute("aria-pressed", String(picks[id] === o.dataset.pick)));
      });
    });
    const ab = $("#approveBtn");
    if (ab) ab.addEventListener("click", approve);
  }

  async function send() {
    const msg = $("#sendMsg"), btn = $("#sendBtn");
    const name = ($("#who")?.value || "").trim();
    const comment = ($("#comment")?.value || "").trim();
    if (!name) { msg.className = "msg err"; msg.textContent = "Add your name first so we know who picked what."; $("#who").focus(); return; }
    if (!Object.keys(picks).length && !comment) { msg.className = "msg err"; msg.textContent = "Tap at least one choice or leave a comment."; return; }
    store.set("name", name);
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await api("POST", { action: "vote", week: plan.week, name, picks, comment });
      if (!r.ok) throw new Error(r.error || "Couldn't save");
      await load(false);
      const m = $("#sendMsg"); if (m) { m.className = "msg ok"; m.textContent = "Thanks " + name + ", your picks are in. You can change them any time before the deadline."; m.scrollIntoView({ block: "center", behavior: "smooth" }); }
    } catch (e) {
      msg.className = "msg err"; msg.textContent = "Didn't send: " + e.message + ". Check your signal and try again.";
    } finally { btn.disabled = false; btn.textContent = "Send my picks"; }
  }

  async function approve() {
    const msg = $("#pamMsg"), btn = $("#approveBtn");
    const pin = $("#pin").value.trim();
    if (!pin) { msg.className = "msg err"; msg.textContent = "Enter the PIN."; return; }
    const decisions = {}; plan.choices.forEach(c => decisions[c.id] = $("#dec-" + c.id).value);
    btn.disabled = true; btn.textContent = "Approving…";
    try {
      const r = await api("POST", { action: "approve", week: plan.week, pin, decisions, note: $("#pamNote").value.trim() });
      if (!r.ok) throw new Error(r.error || "Couldn't approve");
      await load(false); window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      msg.className = "msg err"; msg.textContent = e.message; btn.disabled = false; btn.textContent = "Approve this shop";
    }
  }

  async function load(first = true) {
    try {
      if (first) {
        const r = await fetch("plan.json?ts=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("plan");
        plan = await r.json();
      }
      try { state = await api("GET", null, plan.week); } catch { state = { votes: [], approval: null }; }
      state.votes = state.votes || [];
      render();
    } catch {
      $("#app").innerHTML = `<p class="loading">No shop planned yet this week. Check back soon.</p>`;
    }
  }

  $("#sendBtn").addEventListener("click", send);
  load();
})();
</script>
</body>
</html>
